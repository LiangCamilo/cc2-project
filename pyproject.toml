[project]
name = "cc2-project"
version = "0.1.0"
description = "Recomendador musical controlable por el usuario mediante Zonas de Tolerancia Acústica (ZTA)
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["common", "common.*", "audit", "audit.*", "clean", "clean.*", "zta", "zta.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
