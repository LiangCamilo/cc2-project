[project]
name = "cc2-project"
version = "0.1.0"
description = "Recomendador musical controlable por el usuario mediante Zonas de Tolerancia Acústica (ZTA)"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "matplotlib==3.11.1",
  "streamlit==1.64.0",
  "altair==6.3.0",
  "kagglehub==1.0.2",
  "fastapi==0.162.0",
  "uvicorn==0.53.0",
  "pydantic==2.14.1",
]

[dependency-groups]
dev = ["pytest", "httpx==0.28.1"]

[tool.poetry]
packages = [
  { include = "common", from = "src" },
  { include = "audit", from = "src" },
  { include = "clean", from = "src" },
  { include = "zta", from = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"